name: release

# Pushing a tag like 0.1.0 publishes that version to PyPI. Running the workflow by hand publishes a
# development version to TestPyPI, for trying out the pipeline without making a release.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the package version from git tags.
          fetch-depth: 0
      # Fail before anything gets published if the changelog has no notes for this version.
      - name: Check the changelog
        if: github.ref_type == 'tag'
        run: .github/scripts/get_changelog_section.sh "$GITHUB_REF_NAME"
      # setup-uv publishes no floating major version tag, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/borgmatic-browse
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/borgmatic-browse
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      # Required for creating a release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create a GitHub release from the changelog
        # Setting the shell explicitly turns on pipefail.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/get_changelog_section.sh "$GITHUB_REF_NAME" |
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file -
